[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snack-gpt"
version = "0.1.0"
description = "A local, voice-enabled food logger"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0,<2"]

[project.scripts]
snack-gpt = "snack_gpt.__main__:main"
snackgpt = "snack_gpt.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["snack_gpt"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["snack_gpt", "tests"]